server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/eka.pem;       # mkcert eka.local
    ssl_certificate_key /etc/nginx/certs/eka-key.pem;
    client_max_body_size 51m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /api/v1/query {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_buffering off;          # SSE: send each token as it arrives
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
