# Start: docker compose -f deploy/docker-compose.yml up -d
# First run only: docker compose -f deploy/docker-compose.yml --profile setup run --rm models
networks:
  backend:
    internal: true   # no route to the internet
  egress: {}         # api only: reaches the hosted LLM provider
  edge: {}

volumes:
  pgdata:
  filestore:
  models:
  ollama-models:

x-app: &app
  build: { context: .., dockerfile: deploy/Dockerfile }
  env_file: ../.env
  environment:
    DATABASE_URL: postgresql://eka:${POSTGRES_PASSWORD:-eka}@postgres:5432/eka
    DATA_DIR: /data
    MODELS_DIR: /models
    HF_HUB_OFFLINE: "1"
    COOKIE_SECURE: "true"
  volumes:
    - filestore:/data
    - models:/models
  depends_on: [postgres]
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: eka
      POSTGRES_USER: eka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eka}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]
    restart: unless-stopped

  api:
    <<: *app
    command: sh -c "alembic upgrade head && uvicorn eka.web.app:app --host 0.0.0.0 --port 8000 --proxy-headers"
    networks: [backend, egress]

  worker:
    <<: *app
    command: python -m eka.worker
    networks: [backend]   # parsers never get a network route out
    volumes:
      - filestore:/data
      - models:/models
      - ${SOURCES_DIR:-./sources}:/sources:ro   # watched folders, read-only

  nginx:   # serves the built web app and proxies /api
    build: { context: .., dockerfile: deploy/nginx.Dockerfile }
    volumes:
      - ./certs:/etc/nginx/certs:ro
    ports: ["443:443"]
    networks: [edge, backend]
    depends_on: [api]
    restart: unless-stopped

  # Optional local LLM: `--profile local-llm`, then LLM_BASE_URL=http://ollama:11434/v1
  ollama:
    image: ollama/ollama
    profiles: [local-llm]
    volumes: [ollama-models:/root/.ollama]
    environment: { OLLAMA_NUM_PARALLEL: "2", OLLAMA_KEEP_ALIVE: "24h" }
    networks: [backend]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  # One-off download of the embedding and re-ranker weights into the models volume.
  models:
    <<: *app
    profiles: [setup]
    environment: { MODELS_DIR: /models }
    command: python -c "from eka.core import models; models.count_tokens('x'); models.rerank('q', ['d']); print('models ready')"
    networks: [egress]
    depends_on: []
    restart: "no"
